services:
  api:
    build:
      context: .
      target: api
    environment:
      ORCH_ADDR: ":8080"
      ORCH_DATABASE_URL: postgres://orchestrator:orchestrator@postgres:5432/orchestrator?sslmode=disable
      ORCH_EMBEDDED_WORKERS: "false"
      ORCH_STATIC_DIR: /app/frontend/dist
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    build:
      context: .
      target: worker
    environment:
      ORCH_DATABASE_URL: postgres://orchestrator:orchestrator@postgres:5432/orchestrator?sslmode=disable
      ORCH_WORKERS: "1"
      ORCH_WORKER_ID: compose-worker
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
